name: Public demo tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.7'
      - run: 'python -m pip install --require-hashes --only-binary=:all: -r requirements.lock'
      - run: python -m pip check
      - run: python -m pytest -q
      - run: python scripts/check_public_bundle.py
      - run: python scripts/audit_dependencies.py
      - run: node --check tony_demo/static/app.js
